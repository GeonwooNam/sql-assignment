# Streamlit Community Cloud 앱이 잠들지 않게 유지한다.
#
# 무료 티어는 트래픽이 12시간 없으면 앱을 잠재운다. 학회원이 새벽에 처음 열면
# "get this app back up" 화면을 보고 30초를 기다려야 한다.
#
# 주의: UptimeRobot 같은 단순 GET 핑거는 통하지 않는다. 잠든 앱도 GET 에는 200 을
# 돌려주기 때문에 트래픽으로 집계되지 않는다. 실제 브라우저로 접속해서 웹소켓
# 세션이 붙어야 한다. 그래서 Playwright 를 쓴다.
#
# 설정: 리포 Settings → Secrets and variables → Actions → New repository secret
#       이름 APP_URL, 값은 배포된 앱 주소 (예: https://sql-assignment.streamlit.app)

name: keep-awake

on:
  schedule:
    # 12시간 임계보다 넉넉하게 6시간마다. GitHub 크론은 지연될 수 있어 여유를 둔다.
    - cron: "0 */6 * * *"
  workflow_dispatch: # 수동 실행 (공지 직전에 한 번 눌러두면 좋다)

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Playwright 설치
        run: |
          pip install --quiet playwright
          playwright install --with-deps chromium

      - name: 앱 깨우기
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::APP_URL 시크릿이 설정되지 않았습니다."
            exit 1
          fi
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright

          url = os.environ["APP_URL"]
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.goto(url, timeout=60_000)

              # 잠들어 있으면 깨우기 버튼이 뜬다. 없으면 이미 깨어 있는 것.
              btn = page.get_by_text("get this app back up", exact=False)
              woke = bool(btn.count())
              if woke:
                  btn.first.click()
                  print("잠들어 있었음 → 깨우기 클릭")
              else:
                  print("이미 깨어 있음")

              # 웹소켓 세션이 실제로 붙어야 트래픽으로 집계된다. 넉넉히 머문다.
              page.wait_for_timeout(30_000)
              print("최종 제목:", page.title())

              # 깨우기 경로는 앱이 실제로 잠들었을 때만 실행되므로 평소에는 시험되지 않는다.
              # Streamlit 이 버튼 문구를 바꾸면 버튼을 못 찾고 "이미 깨어 있음"으로 빠져
              # 실패인데 success 로 끝난다. 조용히 망가지는 걸 막으려고 끝에서 확인한다.
              body = page.inner_text("body")[:600].lower()
              asleep = ["get this app back up", "has gone to sleep", "app is sleeping"]
              if any(m in body for m in asleep):
                  browser.close()
                  raise SystemExit(
                      "❌ 깨우지 못했습니다 — 30초 뒤에도 잠자기 화면입니다.\n"
                      "   깨우기 버튼 문구가 바뀌었을 수 있습니다. 워크플로의 "
                      "get_by_text 문자열을 실제 화면과 맞춰주세요."
                  )
              print("✅ 깨어 있는 상태 확인" + (" (이번 실행에서 깨움)" if woke else ""))
              browser.close()
          PY
